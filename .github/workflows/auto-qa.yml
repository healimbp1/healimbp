name: Daily 2x AI Q&A Auto-Publisher

on:
  schedule:
    # 하루 2회 자동 발행 (한국 시간 KST 기준):
    # 1. 오전 11:00 KST (02:00 UTC) - 오전 진료 및 검색 시간대
    # 2. 오후 15:30 KST (06:30 UTC) - 오후 휴식 및 검색 시간대
    - cron: '0 2 * * *'
    - cron: '30 6 * * *'
  # GitHub 웹에서 수동으로 'Run workflow' 버튼을 눌러 즉시 1개 발행도 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Q&A via Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/generate-daily-qa.mjs

      - name: Commit and Push New Q&A
        run: |
          git add content/qa/
          if git diff --staged --quiet; then
            echo "No new Q&A generated."
          else
            git commit -m "feat(qa): auto-publish 2x daily clinical Q&A case study"
            git push origin main
          fi
