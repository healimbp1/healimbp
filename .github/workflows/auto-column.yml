name: Daily 2x AI Health Column Auto-Publisher

on:
  schedule:
    # 하루 2회 자동 발행 (한국 시간 KST 기준):
    # 1. 오전 08:30 KST (23:30 UTC 전날) - 출근/아침 시간대
    # 2. 오후 18:30 KST (09:30 UTC 당일) - 퇴근/저녁 시간대
    - cron: '30 23 * * *'
    - cron: '30 9 * * *'
  # GitHub 웹에서 수동으로 'Run workflow' 버튼을 눌러 즉시 1개 발행도 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Health Column via AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TISTORY_ACCESS_TOKEN: ${{ secrets.TISTORY_ACCESS_TOKEN }}
          TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
          TISTORY_CATEGORY_ID: ${{ secrets.TISTORY_CATEGORY_ID }}
          TISTORY_VISIBILITY: ${{ secrets.TISTORY_VISIBILITY }}
        run: |
          node scripts/generate-column.mjs

      - name: Validate Column Integrity & Thumbnails
        run: |
          node scripts/validate-columns.mjs

      - name: Commit and Push New Column
        run: |
          git add content/column/ static/
          if git diff --staged --quiet; then
            echo "No new column generated."
          else
            git commit -m "feat(column): auto-publish 2x daily medical column by Director Kwon Hyung-keun"
            git push origin main
          fi
